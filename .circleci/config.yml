# The CircleCI app is installed on this repo but there was no configuration, so
# every pull request reported "No configuration was found in your project" as a
# failed check. This runs the widget's dependency-free unit tests instead.
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout
      - run:
          name: Widget unit tests
          command: |
            node tests/findAccountForApp.js
            node tests/build-app-scope.js

workflows:
  build:
    jobs:
      - test
